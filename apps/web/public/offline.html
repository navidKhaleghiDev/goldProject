<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#F7F4ED" />
    <title>نت گلد | بدون اتصال</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #f7f4ed; color: #171714; font-family: Tahoma, Arial, sans-serif; }
      main { max-width: 420px; text-align: center; }
      img { width: 72px; height: 72px; }
      h1 { margin-top: 32px; font-size: 24px; }
      p { color: #6f6b62; font-size: 14px; line-height: 2; }
      a { display: inline-flex; min-height: 48px; align-items: center; justify-content: center; margin-top: 24px; padding: 12px 24px; border-radius: 6px; background: #171714; color: #f7f4ed; text-decoration: none; }
      a:focus-visible { outline: 2px solid #8c672f; outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="نشان نت گلد" />
      <h1>اتصال به اینترنت برقرار نیست</h1>
      <p>برای دیدن نرخ و موجودی معتبر، دوباره به اینترنت متصل شوید. معامله‌ها در حالت آفلاین ثبت یا برای ارسال بعدی ذخیره نمی‌شوند.</p>
      <p>اگر هنگام ثبت معامله ارتباط قطع شد، پیش از تلاش دوباره تاریخچه فعالیت را بررسی کنید.</p>
      <a href="/">تلاش دوباره</a>
    </main>
  </body>
</html>
