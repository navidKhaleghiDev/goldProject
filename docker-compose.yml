services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: sheri_gold
      POSTGRES_USER: sheri_gold
      POSTGRES_PASSWORD: sheri_gold
    ports:
      - '5432:5432'
    volumes:
      - sheri-gold-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U sheri_gold -d sheri_gold']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  sheri-gold-postgres:
